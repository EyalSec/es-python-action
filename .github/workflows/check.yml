name: check
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck lib/main.sh
          # The CI driver is kept identical to the copy EyalSec serves at /ci.sh.
          shellcheck -S warning lib/es-python-ci.sh
      - name: actionlint
        run: |
          # A fixed release, checked against its published SHA-256 before it runs.
          curl -fsSLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

  # The action must refuse cleanly, with a message, when no key is passed:
  # that is what a pull request from a fork sees.
  no-key:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: es
        continue-on-error: true
        uses: ./
        with:
          api-key: ""
          run: es-python -m pytest
      - name: expect a clean refusal
        env:
          OUTCOME: ${{ steps.es.outcome }}
          RESULT: ${{ steps.es.outputs.result }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT"
          [ "$OUTCOME" = failure ] && [ "$RESULT" = error ]
